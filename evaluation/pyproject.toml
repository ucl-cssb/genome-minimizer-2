[project]
name = "genome-minimizer-evaluation"
version = "0.1.0"
description = "vEcoli-based viability evaluation for genome-minimizer-2 pipeline"
requires-python = ">=3.11"
dependencies = [
    "vecoli @ git+https://github.com/CovertLab/vEcoli",
    "ray[default]",
    "pandas",
    "pyarrow",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
