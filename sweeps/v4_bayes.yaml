# Phase C: Bayesian hyperparameter sweep on the v4 LOSS configuration.
#
# v0–v4 are distinguished by *loss function*, not hyperparameters. This sweep
# keeps the v4 loss intact (same KL schedule, gene-abundance loss, essential-gene
# loss, L1) and varies HYPERPARAMETERS only. The winner will be promoted to an HF
# branch named `v4_opt` (a tuned-v4 variant), NOT v5 — there is no new loss.
#
# essential_weight=0 reduces the v4 loss to v3-equivalent behavior, so the sweep
# can discover whether the essential-gene loss is helping at all.
#
# Hyperband terminates underperforming runs early (min_iter=200 epochs) so total
# wall-clock is bounded.

program: main.py
project: genome-minimizer-2
method: bayes
metric:
  name: test/f1_overall
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 200
  eta: 3
parameters:
  # Kebab-case keys so the ${args} macro emits flags argparse accepts
  # (e.g. --learning-rate=...). Wandb does NOT auto-translate underscores.
  learning-rate:
    distribution: log_uniform_values
    min: 3.0e-4
    max: 3.0e-3
  essential-weight:
    values: [0.0, 0.1, 0.5, 1.0, 5.0]
  gamma-start:
    values: [1.0, 2.0]
  latent-dim:
    values: [32, 64]
  random-state:
    values: [12345, 42, 7]
command:
  - ${env}
  - python
  - ${program}
  - --mode=experiment
  - --trainer-version=v4
  - --hidden-dim=512
  - --n-epochs=500
  - --batch-size=32
  - --lambda-l1=0.01
  - --scheduler-step-size=2000
  - --scheduler-gamma=0.5
  - --gamma-end=0.1
  - --weight=1.0
  - --no-save-model
  - --no-hf-upload
  - --no-generate-plots
  - --no-explore-latent-space
  - --experiment-name=v4_opt_sweep
  # ${args} expands `parameters:` entries to `--<kebab-key>=<value>`. So
  # `learning_rate -> --learning-rate=0.0012`, etc. — which argparse accepts.
  - ${args}
