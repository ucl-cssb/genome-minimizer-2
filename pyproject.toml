[project]
name = "genome-minimizer-2"
version = "0.1.0"
description = ""
authors = [
    {name = "stacyshcherbakova",email = "stacyshcherbakova@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "torch",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "scipy",
    "biopython",
    "wandb",
    "huggingface_hub",
